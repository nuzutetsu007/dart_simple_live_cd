name: app-build-manual

on:
  workflow_dispatch:   # ✅ 手动触发

jobs:
  build-macos-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Java（其实 iOS/macOS 不需要，但 flutter 依赖有时会用）
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Desktop
        run: flutter config --enable-macos-desktop

      - name: Install deps
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install tools
        run: |
          npm install -g appdmg
          dart pub global activate flutter_distributor

      # ✅ macOS
      - name: Build macOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: simple_live_app/build/dist/*/*

      # ✅ iOS（无签名）
      - name: Build iOS
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ios_no_sign.ipa Payload

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa


  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv

      - name: Enable Desktop
        run: flutter config --enable-linux-desktop

      - name: Build
        run: |
          cd simple_live_app
          flutter pub get
          dart pub global activate flutter_distributor
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: simple_live_app/build/dist/*/*


  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Desktop
        run: flutter config --enable-windows-desktop

      - name: Build
        run: |
          cd simple_live_app
          flutter pub get
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: simple_live_app/build/dist/*/*
